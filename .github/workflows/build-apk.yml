name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build web app
        run: |
          cd frontend
          npm run build

      - name: Install Capacitor dependencies
        run: |
          cd my-mobile-app
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Sync Capacitor
        run: |
          cd my-mobile-app
          npx cap sync android

      - name: Grant execute permission
        run: chmod +x my-mobile-app/android/gradlew

      - name: Build Debug APK
        run: |
          cd my-mobile-app/android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: my-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: my-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk